name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify, Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: 1. Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 2. TypeScript Strict Typecheck
        run: pnpm typecheck

      - name: 3. ESLint & Architectural Boundaries
        run: pnpm lint

      - name: 4. Workspace Unit & Integration Test Suites
        run: pnpm test

      - name: 5. Adversarial Attack Suite Runner (A-01 to A-12)
        run: pnpm attack-suite

      - name: 6. Production Dashboard Web Build
        run: pnpm build

      - name: 7. Ephemeral End-to-End Smoke Verification
        run: pnpm smoke
