# AegisMandate — strict gitleaks config (replaces .gitleaks.toml)
#
# Design rules:
#   1. No global pattern allowlist.
#   2. No whole-file allowlists for README.md, ci.yml or test files.
#   3. Paths scoped strictly to generated evidence logs (^docs[\\/]evidence[\\/]).
#      All physical working tree secret scans run in clean clones where gitignored
#      development files (.env, data/, node_modules) do not exist.
#   4. Known dummy values and historical fragments are allowed as EXACT strings only.

title = "AegisMandate gitleaks (strict)"

[extend]
useDefault = true

[allowlist]
description = "Generated evidence logs and exact known-dummy values only"
paths = [
  '''^docs[\\/]evidence[\\/]''',
]
regexes = [
  '''0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef''',
  '''c60ce1e12686c9af19411c60913db7c25a3ccbc241dfcf9b8f321e4cac148a2c''',
  '''tok_ac14_empty''',
  '''ORDER-EMPTY-CAP-01''',
  '''A21AAJssYTGu\.\.\.8iUWtg''',
]
