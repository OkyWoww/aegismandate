# AegisMandate — strict gitleaks config (replaces .gitleaks.toml)
#
# Install:  Copy-Item gitleaks.strict.toml .gitleaks.toml -Force
# Note:     Gitleaks on Windows paths requires [\\/] pattern separator support.
#           When using Gitleaks < 8.25 (e.g. 8.18.2), use single [allowlist].
#
# Design rules
#   1. No global pattern allowlist.
#   2. No whole-file allowlists for README.md, ci.yml or test files. Known dummy
#      values and confirmed test fixtures are allowed as EXACT strings only.
#   3. Paths scoped strictly to generated evidence logs, local dev runtime,
#      node_modules, and git internals.
#   4. Do not widen this file to make a scan pass. Read each finding first.

title = "AegisMandate gitleaks (strict)"

[extend]
useDefault = true

[allowlist]
description = "Evidence logs, local dev files, and exact dummy fixtures"
paths = [
  '''docs[\\/]evidence''',
  '''data''',
  '''^\.env$''',
  '''node_modules''',
  '''\.git''',
]
regexes = [
  '''0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef''',
  '''c60ce1e12686c9af19411c60913db7c25a3ccbc241dfcf9b8f321e4cac148a2c''',
  '''tok_ac14_empty''',
  '''ORDER-EMPTY-CAP-01''',
  '''A21AAJssYTGu\.\.\.8iUWtg''',
]
