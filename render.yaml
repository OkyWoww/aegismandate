services:
  - type: web
    name: aegismandate-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm build
    startCommand: node dist/index.js
    envVars:
      - key: PORT
        value: 8787
      - key: NODE_ENV
        value: production
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: OWNER_TOKEN
        sync: false

  - type: web
    name: aegismandate-ui
    runtime: static
    buildCommand: pnpm install && pnpm --filter @aegismandate/web build
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: aegismandate-api
          property: host
